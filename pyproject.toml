[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "takestock"
version = "0.1.0"
description = "Take stock of an IT estate: a cryptographic bill of materials, a configuration register and an IP plan."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mike Clements" }]
keywords = ["cbom", "cyclonedx", "cryptography", "tls", "cmdb", "ipam", "email-security", "inventory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/mike548141/takestock"
Repository = "https://github.com/mike548141/takestock"
Issues = "https://github.com/mike548141/takestock/issues"
Changelog = "https://github.com/mike548141/takestock/blob/main/CHANGELOG.md"

[project.scripts]
takestock = "takestock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
takestock = ["data/*", "py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Pinned so a new ruff release cannot change what the gate means.
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["takestock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
