        - authority: nzism
          control: §17.2.13
          note: >-
            The summary table lists AES with a minimum 256-bit key, and this key is shorter. The table
            is guidance, not a control: no numbered control sets an AES key length, so this is a
            shortfall from guidance, not a breach of a MUST.
      aes256-cbc:
        - authority: cve-2008-5161
          note: plaintext recovery against CBC-mode SSH; ssh-audit warns on it
