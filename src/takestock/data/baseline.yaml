      blowfish:
        - authority: nist-sp-800-131ar2
          control: §2
          note: not approved, and a 64-bit block cipher (Sweet32)
      rc5:
        - authority: nist-sp-800-131ar2
          control: §2
          note: not approved, and a 64-bit block cipher (Sweet32)
      cast:
        - authority: nist-sp-800-131ar2
          control: §2
          note: not approved, and a 64-bit block cipher (Sweet32)
    summary: >-
      SP 800-38A (modes) and CNSA 2.0 (AES-256), with SP 800-131A Rev 2 §2 and NZISM Chapter 17
      for what is approved.
  ike_dh:
    cites:
      - authority: nist-sp-800-56ar3
        note: group strength
      - authority: nist-ir-8547-ipd
        control: Tables 3–5
        note: deprecation dates
      - authority: cnsa-2
        note: >-
          CNSA 2.0 moves away from elliptic curves toward ML-KEM entirely, so no group in this table is
          post-quantum and none is graded `pqc`.
    tokens:
      '1':
        - authority: nist-sp-800-131ar2
          control: §2
          note: a 768-bit finite-field group; under 2048 bits is disallowed
        - authority: nzism
          control: 17.2.19.C.01
          breaches: true
          note: a 768-bit group, below the 3072-bit DH modulus this control requires
          commentary: >-
            Unambiguous. The control requires a Diffie-Hellman modulus of at least 3072 bits and this IKE
            group is 768. The only other control in the manual that mentions DH (17.8.15.C.01) asks for
            the largest modulus available, so no reading of the manual sets a lower floor.
      '2':
        - authority: nist-sp-800-131ar2
          control: §2
          note: a 1024-bit finite-field group; under 2048 bits is disallowed
        - authority: nzism
          control: 17.2.19.C.01
          breaches: true
          note: a 1024-bit group, below the 3072-bit DH modulus this control requires
          commentary: >-
            Unambiguous. The control requires a Diffie-Hellman modulus of at least 3072 bits and this IKE
            group is 1024. The only other control in the manual that mentions DH (17.8.15.C.01) asks for
            the largest modulus available, so no reading of the manual sets a lower floor.
      '5':
        - authority: nist-sp-800-131ar2
          control: §2
          note: a 1536-bit finite-field group; under 2048 bits is disallowed
        - authority: nzism
          control: 17.2.19.C.01
          breaches: true
          note: a 1536-bit group, below the 3072-bit DH modulus this control requires
          commentary: >-
            Unambiguous. The control requires a Diffie-Hellman modulus of at least 3072 bits and this IKE
            group is 1536. The only other control in the manual that mentions DH (17.8.15.C.01) asks for
            the largest modulus available, so no reading of the manual sets a lower floor.
      '14':
        - authority: nist-sp-800-57p1r5
          control: Table 2
          note: a 2048-bit finite-field group — the 112-bit class
        - authority: nist-ir-8547-ipd
          control: Tables 3–5
          note: deprecated after 2030, disallowed after 2035
        - authority: nzism
          control: 17.2.19.C.01
          breaches: true
          note: a 2048-bit group, below the 3072-bit DH modulus this control requires
          commentary: >-
            Unambiguous on the manual's arithmetic: the control requires a Diffie-Hellman modulus of at
            least 3072 bits and this IKE group is 2048, and no other control in the manual sets a lower
            floor. This baseline grades 2048-bit DH acceptable on NIST's strength guidance, so an asset
            can be acceptable by that measure and still short of this control.
      '20':
        - authority: cnsa-2
          note: group 20 is P-384, which was the CNSA 1.0 choice
    summary: >-
      SP 800-56A Rev 3 for group strength and NIST IR 8547 ipd for transition dates. No IKE
      Diffie-Hellman group is post-quantum, so none is graded pqc.
  ike_prf:
    cites:
      - authority: nist-ir-8547-ipd
    tokens:
      hmac-md5:
        - authority: nzism
          control: ch.17 §17.2
          note: MD5 is not an approved hash
      hmac-sha1:
        - authority: nzism
          control: 17.2.26.C.01
          breaches: true
          note: SHA-1 is legacy only
          commentary: >-
            Conditional, and it reaches the report as a question rather than a finding. The control
            requires the SHA-2 family for new systems and permits SHA-1 only for legacy ones, so whether
            it is met turns on whether this is a legacy system — a fact the system owner holds and a
            listener cannot show. Here SHA-1 is the pseudo-random function the IKE exchange derives its
            keys with.
    summary: >-
      NIST IR 8547 ipd for the classical entries; a PRF is quantum-resistant by its hash's
      length.
  smb_dialects:
    cites:
      - authority: microsoft-smb-versions
        note: vendor guidance; NZISM v3.9 carries no SMB control
    tokens:
      SMB1:
        - authority: microsoft-smb-versions
          note: '"we strongly encourage you not to use it"'
        - authority: microsoft-smb-signing
          note: SMB1 signing uses MD5
      SMB2.0.2:
        - authority: microsoft-smb-signing
          note: HMAC-SHA-256 signing; SMB2 has no encryption capability
      SMB3.1.1:
        - authority: microsoft-smb-signing
          note: >-
            Pre-authentication integrity "to prevent downgrade attacks". The `strong` tier is a judgement
            by analogy with TLS 1.3; no standard states it.
    summary: Microsoft's guidance on SMB versions and signing. NZISM has no SMB control.
  deadlines:
    cites:
      - authority: nist-ir-8547-ipd
        control: Tables 2–5
      - authority: cnsa-2-advisory
        control: § Other requirements for NSS (page 6)
        note: >-
          The per-category timetable. Ver. 1.0, Sep 2022 — NOT the FAQ Ver. 2.1, which carries no
          per-category timetable.
    tokens:
      signing_and_networking:
        - authority: cnsa-2-advisory
          control: § Other requirements for NSS (page 6)
          note: >-
            "Software and firmware signing: … exclusively use CNSA 2.0 by 2030"; "Traditional networking
            equipment (e.g., virtual private networks, routers): … exclusively use CNSA 2.0 by 2030." A
            timetable NSA anticipates for US National Security Systems; used here as calibration.
      general_infrastructure:
        - authority: cnsa-2-advisory
          control: § Other requirements for NSS (page 6)
          note: >-
            "Web browsers/servers and cloud services: … exclusively use CNSA 2.0 by 2033"; operating
            systems and niche equipment likewise 2033. A timetable NSA anticipates for US National
            Security Systems; used here as calibration.
      disallow_quantum_vulnerable:
        - authority: nist-ir-8547-ipd
          control: Tables 2–5
          note: >-
            RSA, ECDSA, EdDSA, ECDH and finite-field DH read "Disallowed after 2035" at every security
            strength; the 112-bit rows add "Deprecated after 2030". NIST's expected approach in an initial
            public draft, not a binding rule.
    summary: >-
      NIST IR 8547 ipd Tables 2 to 5 for 2035, and the NSA CNSA 2.0 advisory (Ver. 1.0, page 6)
      for the 2030 and 2033 per-category split. Neither binds an organisation outside its scope:
      IR 8547 is a draft describing NIST's expected approach for US federal systems, and the
      advisory's timetable is one NSA anticipates for US National Security Systems. They are
      recorded as calibration.
  ssh_cipher:
