        - authority: nzism
          control: 17.2.26.C.01
          breaches: true
          note: SHA-1 is legacy only
          commentary: >-
            Conditional, and it reaches the report as a question rather than a finding. The control
            requires the SHA-2 family for new systems and permits SHA-1 only for legacy ones, so whether
            it is met turns on whether this is a legacy system — a fact the system owner holds and a
            listener cannot show. Here SHA-1 authenticates each packet, truncated to a 96-bit tag.
      hmac-md5-96:
        - authority: nist-sp-800-107r1
          control: §5.3.4
          note: a 96-bit truncation of a broken hash is not stronger than the hash
      hmac-md5-96-etm@openssh.com:
        - authority: nist-sp-800-107r1
          control: §5.3.4
          note: a 96-bit truncation of a broken hash is not stronger than the hash
    summary: >-
      NIST IR 8547 ipd for the classical entries and SP 800-107 Rev 1 for truncated tags. A MAC
      is quantum-resistant by its hash's length, so no post-quantum MAC exists to grade.
  ike_encryption:
    cites:
      - authority: nist-sp-800-38a
        note: the modes
      - authority: cnsa-2
        note: requires AES-256
      - authority: nist-sp-800-131ar2
        control: §2
        note: approves AES and 3DES-legacy only
      - authority: nzism
