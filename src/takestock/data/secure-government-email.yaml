# Secure Government Email (SGE) Common Implementation Framework: the
# requirement set, machine-readable.
#
# This file encodes a public New Zealand government standard, published at
# digital.govt.nz, and is read by `takestock.sge`. Every requirement is
# transcribed from the source documents listed under `documents:`, and every
# `level_basis.quote` is the deciding sentence, verbatim. Where a quotation
# had to be shortened, the row says so.
#
# How `level` is decided, one sentence at a time:
#   must         the requirement's own sentence says must, must not or
#                mandatory (NZISM prints the same word as MUST). "Is
#                required" counts only where the reading is unambiguous, and
#                such a row says so in `level_basis.judgement`.
#   recommended  the sentence says should, recommended, strongly recommended
#                or advised; and also wherever the wording is vague or a bare
#                imperative with no such word: "needs to", "will need to",
#                "Enforce…", "Set…", "Do not…".
# A heading or a list lead-in ("Requirement", "technologies required to be
# deployed") confers nothing on the sentences beneath it. The strongest
# explicit sentence in any listed source decides, so a requirement a guide
# states as "must" is not demoted because the framework phrased it as
# "needs to". The documents use no "could" or "won't" as a grading.
#
# `level_basis` carries the deciding sentence and where it was read. A
# `must` whose quote has no must or mandatory word, or a `recommended` whose
# quote has no should, recommend or advise word, carries a `judgement` saying
# why.
#
# `measurable` says what an outside observer can establish, and drives the
# not-measured outcome `takestock.sge` treats as a first-class result:
#   observed       a collector produces the fact
#   not-collected  measurable from outside, but no collector reads it yet
#   no-instrument  cannot be seen from outside the organisation at all
#
# `partial` is quoted into the evaluator's row: what the reading does not
# cover, written as a sentence a reader can use. `record`, where present,
# names the DNS record the standard asks for; the evaluator checks it against
# the name actually read rather than taking it as an instruction.
# `settled_by` names the evidence that would settle the requirement when a
# report has to leave it unmeasured; the conformance note prints it.

standard:
  id: sge
  name: Secure Government Email Common Implementation Framework
  short: SGE
  version: "1.1"
  issuer: Government Chief Digital Officer, Government Digital Delivery Agency
  applies_to: New Zealand government agencies
  replaces: SEEMail (Secure Encrypted Email)
  classification_ceiling: IN-CONFIDENCE
  deadline: 2026-10
  deadline_note: >-
    The framework requires implementation by October 2026, and SEEMail is
    intended to be decommissioned during 2026. Both dates are the
    document's own wording.
  home: https://www.digital.govt.nz/products-and-services/products-and-services-a-z/secure-government-email

# The source documents, so a requirement can cite the thing it was read from.
# `sha256` is the first sixteen hexadecimal characters of the published
# file's SHA-256: enough to tell two versions apart. Re-fetch and compare
# before relying on a quotation.
