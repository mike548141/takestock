# Windows client and server servicing dates, from Microsoft's published lifecycle.
#
# A Windows device reports a version string such as 10.0.26100.1234. The third part is the OS
# build, and the build selects a feature-update version (26100 is Windows 11 version 24H2). The
# end of servicing for that version then depends on the edition: Enterprise and Education get a
# longer window than Home and Pro for the same build. So every table here is either keyed by build
# for one edition family, or lists products that carry their own build.
#
# Where the dates come from (all public Microsoft pages):
#   https://learn.microsoft.com/lifecycle/products/windows-11-enterprise-and-education
#   https://learn.microsoft.com/lifecycle/products/windows-11-home-and-pro
#   https://learn.microsoft.com/lifecycle/products/windows-10-enterprise-and-education
#   https://learn.microsoft.com/lifecycle/products/windows-10-home-and-pro
#   https://learn.microsoft.com/lifecycle/products/ (one page per LTSC and Windows Server release)
#   https://learn.microsoft.com/windows/release-health/windows11-release-information
#   https://learn.microsoft.com/windows/release-health/release-information
#   https://learn.microsoft.com/windows-server/get-started/windows-server-release-info
# What each kind of page states, and what this file records:
#   - The release-information pages give the version-to-build mapping, and each date as an
#     ISO 8601 day. An end there is the day of the last monthly security update, the second
#     Tuesday of the month ("Patch Tuesday"): Windows 11 version 24H2 Enterprise, 2027-10-12.
#   - The lifecycle pages hold each end, in their markup, as an instant on the Wednesday after
#     that Tuesday at 6:59:59 AM (for 24H2 Enterprise, "10/13/2027 6:59:59 AM"), and display it as
#     a date in Pacific time, which is the Tuesday ("Oct 12, 2027"). Their prose gives the Tuesday
#     too: "Windows 10 will reach end of support on October 14, 2025".
#   - This file records the last full day of support: the Tuesday, which is the release-information
#     date and the day before the lifecycle pages' instant. Where both kinds of page give a date for
#     the same version, the release-information page is used, and a comment on the row says so if
#     the two disagree, giving the lifecycle page's date read by the same rule (the day before its
#     instant).
#
# Dates are ISO 8601 days. `start` is availability; `end` (or `extended_end` where a product has
# one) is the last day security updates are published without a paid extension.
#
# Tables:
#   windows_11_enterprise_education  Windows 11 General Availability Channel, Enterprise,
#                                    Education, IoT Enterprise and Enterprise multi-session
#   windows_11_home_pro              Windows 11 General Availability Channel, Home, Pro,
#                                    Pro Education and Pro for Workstations
#   windows_10_enterprise_education  Windows 10, the same edition split as above
#   windows_10_home_pro
#   windows_ltsc                     Long-Term Servicing Channel and Branch releases; these share a
#                                    build with a General Availability version but not its dates
#   windows_server                   Windows Server Long-Term Servicing Channel releases;
#                                    `esu_end` is the last year of paid Extended Security Updates
#                                    outside Azure, where Microsoft offered them
# `editions_covered` lists the editions the windows_11_enterprise_education table may be applied
# to: the four the Windows 11 release-information page names for that column ("Enterprise,
# Education, IoT Enterprise, and Enterprise multi-session"), written without spaces as device
# inventories report them. A device whose edition is not listed is left unmatched rather than
# given another edition's dates.
#
# Not included: Windows Server Semi-Annual and Annual Channel releases, and the paid Extended
# Security Updates offer for Windows 10, whose end dates Microsoft does not list on the pages
# above.
#
# To extend it: add a row per new version from the release-information page, keyed by its OS
# build, and check the build against the page heading ("Version 26H2 (OS build 26300)").
schema: 1
editions_covered: [Enterprise, Education, IoTEnterprise, EnterpriseMultisession]

windows_11_enterprise_education:
