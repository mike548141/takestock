# End-of-support dates for widely used server and platform software.
#
# A software inventory names a product and a version ("Ubuntu 22.04.4 LTS", "PostgreSQL 13.9").
# This table says, for each product line, which support phase applies on a given date: still
# fully supported, security fixes only, or past the end of support. It covers major Linux
# distributions, databases, language runtimes, web servers, OpenSSL and VMware vSphere. Windows
# client and server releases are in windows-lifecycle.yaml instead.
#
# Where the dates come from: the vendor's own published lifecycle for Ubuntu, Oracle Linux,
# Oracle Database, MySQL, SQL Server, PostgreSQL, Python, Node.js, .NET, Java and the current
# OpenSSL series; endoflife.date (a community-maintained aggregator that cites each vendor) for
# the rest, whose dates were not checked one by one against the vendor's own page (Red Hat's,
# for one, needs a browser to render). Every variant names its source, and `sources` gives
# that source's address, the day it was read, and what it states. Dates are written exactly as
# the source gives them: a day (2029-05-31) where the source gives a day, and a month (2029-05)
# where the vendor states only a month, as Canonical, Oracle, the Python release team and
# Adoptium do. Microsoft's lifecycle pages state SQL Server dates as US Pacific timestamps,
# recorded here as Pacific days; where those pages render a date inconsistently with their own
# convention, the date is recorded to the month only.
#
# Selection: every currently supported version line of each product in scope, plus ended lines
# back to a cut-off set per product, not a fixed date. The oldest line kept is: RHEL 5,
# CentOS 5, Oracle Linux 6, Ubuntu 14.04, Debian 7, SLES 11 SP4, Amazon Linux AMI, SQL Server
# 2008, PostgreSQL 9.4, MySQL 5.5, Oracle Database 11.2, Python 2.7 and 3.2, Node.js 4,
# .NET Core 1.0, Java 8, Apache HTTP Server 2.0, OpenSSL 1.0.1, ESXi and vCenter 6.0. Rocky,
# AlmaLinux and CentOS Stream are complete. A product with no published end date for its
# current line (OpenSSH, nginx, Apache HTTP Server 2.4) is left out rather than given a guess,
# though older Apache HTTP Server lines with a stated end are included.
#
# Shape:
#   sources.<key>     url, read (the day the source was read), says
#   lines[]           one product line, for example one major release
#     id              unique name for the line
#     match[]         how an inventory row is recognised; every listed field must match:
#       kind            inventory row kind: os, application, library or hypervisor
#       product         exact product name, compared ignoring case and repeated spaces
#       product_pattern regular expression the whole product name must match, ignoring case
#       version_pattern regular expression the whole version string must match
#     variants[]      one per reading of the line that the sources distinguish
#       name, source  a label, and the key of its entry in `sources`
#       known_from    optional: the first day a printed status may be applied
#       phases[]      in date order; each phase holds up to and including `until`
#         until         a day (YYYY-MM-DD) or a month (YYYY-MM); inside a month-only boundary
#                       the band is undetermined rather than guessed
#         band          supported | security-only
#         condition     what the phase depends on, when it needs a paid add-on or subscription
#       after         the band once every phase has ended: end-of-support, end-of-life, or
#                     unknown when the source gives only a minimum ("at least") date
#
# A line with a single `supported` phase means the source states only when security fixes stop;
# it does not say that earlier phases were full support. Service-pack-level end dates (SQL Server
# service packs, for example) are not modelled: a line covers the whole major release, so an
# unpatched service pack can be out of support before its line is.
#
# To extend it: add a source, then a line per version with the vendor's own dates and the
# vendor's precision. Keep match patterns tight enough that no inventory row matches two lines;
# a row that does is reported as ambiguous rather than graded.
schema: 1
