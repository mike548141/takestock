# Publish to PyPI when a GitHub release is published.
#
# Uploads use PyPI trusted publishing: PyPI trusts this workflow, in this
# repository, running in the `pypi` environment, and issues a short-lived
# token for each run. No API token is stored anywhere. The trusted publisher
# is configured once on the project's PyPI settings page.
#
# To release: set `version` in pyproject.toml, add the version's section to
# CHANGELOG.md, merge, then publish a GitHub release whose tag is `v` plus that
# version (for example `v0.1.0`). The build job refuses a tag that does not
# match the version in pyproject.toml.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build the sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: The tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match pyproject.toml version $version (expected v$version)" >&2
            exit 1
          fi
      - name: Run the gate
        run: |
          make venv PY=python
          make check PY=python
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/takestock/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Pinned to the commit of release v1.14.2, so the step that holds the
      # upload credential cannot change under a moved tag.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
